name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore DuckDB warehouse from cache
        uses: actions/cache/restore@v4
        with:
          path: data/warehouse.duckdb
          key: duckdb-warehouse-${{ github.run_id }}
          restore-keys: |
            duckdb-warehouse-

      - name: Install pipeline dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt
          dbt deps --project-dir dbt_project

      - name: Run OpenCode agent
        uses: anomalyco/opencode/github@latest
        env:
          # Free tier, no card -- https://aistudio.google.com/apikey
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
